name: habit_builder
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.17.0
  calendar_date_picker2: ^1.1.7
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_native_splash:
  # Use background_image to fill the screen.
  # This replaces the 'color' and 'image' properties.
  background_image: "assets/img/splash_bg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/img/

  fonts:
    - family: manrope
      fonts:
        - asset: assets/font/Manrope-Regular.ttf
        - asset: assets/font/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Manrope-Light.ttf
          weight: 300
        - asset: assets/font/Manrope-Medium.ttf
          weight: 500
        - asset: assets/font/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/font/Manrope-Bold.ttf
          weight: 700
        - asset: assets/font/Manrope-ExtraBold.ttf
          weight: 800
