name: habit_builder
description: Monumental Habits — build habits one step at a time.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

flutter_native_splash:
  background_image: assets/native_splash/splash_bg.png

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Body text. The design only uses Medium and Bold.
    - family: Manrope
      fonts:
        - asset: assets/font/Manrope-Medium.ttf
          weight: 500
        - asset: assets/font/Manrope-Bold.ttf
          weight: 700
    # Display headings: OFL stand-in for the design's Klasik (see docs/DESIGN_SYSTEM.md).
    - family: Fredoka
      fonts:
        - asset: assets/font/Fredoka-SemiBold.ttf
          weight: 600
