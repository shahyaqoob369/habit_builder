name: habit_builder
description: Monumental Habits — build habits one step at a time.
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  firebase_core: ^5.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  font_awesome_flutter: ^11.0.0
  go_router: ^17.5.0
  intl: any
  package_info_plus: ^10.2.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.2.0

# Regenerate with `dart run flutter_native_splash:create`, then re-apply the
# transparent status bar in android/app/src/main/res/values*/styles.xml
# (see docs/MEMORY.md).
flutter_native_splash:
  background_image: assets/native_splash/splash_background.png
  # Android 12+ only allows an icon on a color; the Flutter splash follows.
  android_12:
    color: "#FFF3E9"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/img/splash/
    - assets/img/onboarding/
    - assets/img/auth/
    - assets/img/brand/
    - assets/img/nav/
    - assets/img/home/
    - assets/img/habits/
    - assets/img/courses/
    - assets/img/community/
    - assets/img/settings/
    - assets/img/premium/
    - assets/img/profile/

  fonts:
    # Body text. The design only uses Medium and Bold.
    - family: Manrope
      fonts:
        - asset: assets/font/Manrope-Medium.ttf
          weight: 500
        - asset: assets/font/Manrope-Bold.ttf
          weight: 700
    # Display headings: OFL stand-in for the design's Klasik (see docs/DESIGN_SYSTEM.md).
    - family: Fredoka
      fonts:
        - asset: assets/font/Fredoka-SemiBold.ttf
          weight: 600
