name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      # The real Firebase config and RevenueCat keys are local-only (the repo
      # is public). The unit and widget tests never touch either, so
      # placeholders are enough for the code to compile. See docs/FIREBASE.md
      # and docs/REVENUECAT.md.
      - name: Write placeholder Firebase and RevenueCat options
        run: |
          cp tool/ci/firebase_options_stub.dart lib/firebase_options.dart
          cp tool/ci/revenuecat_options_stub.dart lib/revenuecat_options.dart

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
